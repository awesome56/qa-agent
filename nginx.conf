# Alternative to Caddy — if you prefer nginx + certbot
# Usage: docker compose -f docker-compose.prod.yml up will use Caddy by default.
# To use nginx: replace caddy service with this config and run certbot manually.

upstream qa_agent {
    server api:8000;
}

server {
    listen 80;
    server_name qa.awesometech.com.ng www.qa.awesometech.com.ng;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # health without TLS for LB
    location /health {
        proxy_pass http://qa_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name qa.awesometech.com.ng;

    ssl_certificate /etc/letsencrypt/live/qa.awesometech.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa.awesometech.com.ng/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSE important: disable buffering
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    location / {
        proxy_pass http://qa_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /storage/ {
        proxy_pass http://qa_agent;
        # large video files
        client_max_body_size 100M;
    }
}
