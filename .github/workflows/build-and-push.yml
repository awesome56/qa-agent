name: build-closed-and-push-ghcr

"on":
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "playwright/**"
      - "k6/**"
      - "Dockerfile*"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/qa-agent
          tags: |
            type=raw,value=closed
            type=sha,prefix=closed-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push closed image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.closed
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # closed build — no .py source in image, like opencode v2 binary

      - name: Verify no .py in image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/qa-agent:closed
          docker run --rm ghcr.io/${{ github.repository_owner }}/qa-agent:closed sh -c "if find /app/app -name '*.py' | grep -q .; then echo 'FAIL: .py found'; exit 1; else echo 'OK: no .py source'; fi"

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/qa-agent:closed — Lenovo can pull with GHCR_PAT"
